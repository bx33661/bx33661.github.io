<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: #FFFFFF; background-color: #FFFFFF; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="2369px" height="1537px" viewBox="0 0 2369 1537"><defs/><rect fill="#FFFFFF" width="100%" height="100%" x="0" y="0" style="fill: rgb(255, 255, 255);"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="02-handshake-sequence-1"><g><rect x="20" y="20" width="2304" height="76" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#172B3A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="52px" style="fill: rgb(23, 43, 58);"><text x="20" y="82">协议升级与业务权限的分界</text></g></g></g><g data-cell-id="02-handshake-sequence-2"><g><rect x="20" y="104" width="2304" height="60" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#526575" font-family="Helvetica" text-anchor="start" font-size="32px" style="fill: rgb(82, 101, 117);"><text x="20" y="148">经典 HTTP/1.1 路径；wss:// 场景先完成 TLS 握手。应用部分采用首条消息认证作为示例。</text></g></g></g><g data-cell-id="02-handshake-sequence-3"><g><rect x="368" y="194" width="360" height="84" fill="#f4f6f8" stroke="#c6d0d9" stroke-width="2" pointer-events="all" style="fill: rgb(244, 246, 248); stroke: rgb(198, 208, 217);"/></g><g><g fill="#172B3A" font-family="Helvetica" text-anchor="middle" font-size="34px" style="fill: rgb(23, 43, 58);"><text x="548" y="251">浏览器客户端</text></g></g></g><g data-cell-id="02-handshake-sequence-4"><g><rect x="1568" y="194" width="360" height="84" fill="#f4f6f8" stroke="#c6d0d9" stroke-width="2" pointer-events="all" style="fill: rgb(244, 246, 248); stroke: rgb(198, 208, 217);"/></g><g><g fill="#172B3A" font-family="Helvetica" text-anchor="middle" font-size="34px" style="fill: rgb(23, 43, 58);"><text x="1748" y="251">应用服务端</text></g></g></g><g data-cell-id="02-handshake-sequence-5"><g><path d="M 548 288 L 548 1432" fill="none" stroke="#526575" stroke-width="2" stroke-miterlimit="10" stroke-dasharray="8 8" pointer-events="stroke" style="stroke: rgb(82, 101, 117);"/></g></g><g data-cell-id="02-handshake-sequence-6"><g><path d="M 1748 288 L 1748 1432" fill="none" stroke="#526575" stroke-width="2" stroke-miterlimit="10" stroke-dasharray="8 8" pointer-events="stroke" style="stroke: rgb(82, 101, 117);"/></g></g><g data-cell-id="02-handshake-sequence-7"><g><rect x="24" y="330" width="288" height="60" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#526575" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="36px" style="fill: rgb(82, 101, 117);"><text x="24" y="376">协议层</text></g></g></g><g data-cell-id="02-handshake-sequence-8"><g><rect x="24" y="398" width="320" height="56" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#526575" font-family="Helvetica" text-anchor="start" font-size="30px" style="fill: rgb(82, 101, 117);"><text x="24" y="439">HTTP Upgrade</text></g></g></g><g data-cell-id="02-handshake-sequence-9"><g><rect x="620" y="310" width="1056" height="56" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#526575" font-family="Helvetica" text-anchor="middle" font-size="34px" style="fill: rgb(82, 101, 117);"><text x="1148" y="353">GET /socket · Upgrade: websocket</text></g></g></g><g data-cell-id="02-handshake-sequence-10"><g><rect x="620" y="370" width="1056" height="52" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#526575" font-family="Helvetica" text-anchor="middle" font-size="30px" style="fill: rgb(82, 101, 117);"><text x="1148" y="409">Key / Version / Origin（握手输入）</text></g></g></g><g data-cell-id="02-handshake-sequence-11"><g transform="translate(0.5,0.5)"><path d="M 548 440 L 1727.22 440" fill="none" stroke="#526575" stroke-width="3.2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 101, 117);"/><path d="M 1744.42 440 L 1727.22 448.6 L 1727.22 431.4 Z" fill="#526575" stroke="#526575" stroke-width="3.2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 101, 117); stroke: rgb(82, 101, 117);"/></g></g><g data-cell-id="02-handshake-sequence-12"><g><rect x="620" y="478" width="1056" height="56" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#526575" font-family="Helvetica" text-anchor="middle" font-size="34px" style="fill: rgb(82, 101, 117);"><text x="1148" y="521">101 Switching Protocols</text></g></g></g><g data-cell-id="02-handshake-sequence-13"><g><rect x="620" y="538" width="1056" height="52" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#526575" font-family="Helvetica" text-anchor="middle" font-size="30px" style="fill: rgb(82, 101, 117);"><text x="1148" y="577">Sec-WebSocket-Accept（握手回应）</text></g></g></g><g data-cell-id="02-handshake-sequence-14"><g transform="translate(0.5,0.5)"><path d="M 1748 608 L 568.78 608" fill="none" stroke="#526575" stroke-width="3.2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 101, 117);"/><path d="M 551.58 608 L 568.78 599.4 L 568.78 616.6 Z" fill="#526575" stroke="#526575" stroke-width="3.2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 101, 117); stroke: rgb(82, 101, 117);"/></g></g><g data-cell-id="02-handshake-sequence-15"><g><rect x="610" y="632" width="1076" height="56" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#2B628B" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="32px" style="fill: rgb(43, 98, 139);"><text x="1148" y="674">101 只确认协议切换；不自动授予业务权限</text></g></g></g><g data-cell-id="02-handshake-sequence-16"><g><path d="M 20 708 L 2324 708" fill="none" stroke="#526575" stroke-width="2" stroke-miterlimit="10" stroke-dasharray="8 8" pointer-events="stroke" style="stroke: rgb(82, 101, 117);"/></g></g><g data-cell-id="02-handshake-sequence-17"><g><rect x="24" y="754" width="288" height="60" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#2B628B" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="36px" style="fill: rgb(43, 98, 139);"><text x="24" y="800">应用层</text></g></g></g><g data-cell-id="02-handshake-sequence-18"><g><rect x="24" y="822" width="288" height="56" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#526575" font-family="Helvetica" text-anchor="start" font-size="30px" style="fill: rgb(82, 101, 117);"><text x="24" y="863">认证与授权</text></g></g></g><g data-cell-id="02-handshake-sequence-19"><g><rect x="620" y="750" width="1056" height="56" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#2B628B" font-family="Helvetica" text-anchor="middle" font-size="34px" style="fill: rgb(43, 98, 139);"><text x="1148" y="793">auth(ticket) · 首条业务消息认证</text></g></g></g><g data-cell-id="02-handshake-sequence-20"><g transform="translate(0.5,0.5)"><path d="M 548 830 L 1727.22 830" fill="none" stroke="#2b628b" stroke-width="3.2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(43, 98, 139);"/><path d="M 1744.42 830 L 1727.22 838.6 L 1727.22 821.4 Z" fill="#2b628b" stroke="#2b628b" stroke-width="3.2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(43, 98, 139); stroke: rgb(43, 98, 139);"/></g></g><g data-cell-id="02-handshake-sequence-21"><g><rect x="1824" y="746" width="488" height="140" fill="#eaf2f8" stroke="#2b628b" stroke-width="2" pointer-events="all" style="fill: rgb(234, 242, 248); stroke: rgb(43, 98, 139);"/></g><g><g fill="#2B628B" font-family="Helvetica" text-anchor="middle" font-size="34px" style="fill: rgb(43, 98, 139);"><text x="2068" y="811">校验票据</text><text x="2068" y="851">绑定会话身份</text></g></g></g><g data-cell-id="02-handshake-sequence-22"><g><rect x="620" y="868" width="1056" height="56" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#2B628B" font-family="Helvetica" text-anchor="middle" font-size="34px" style="fill: rgb(43, 98, 139);"><text x="1148" y="911">authenticated · 应用确认</text></g></g></g><g data-cell-id="02-handshake-sequence-23"><g transform="translate(0.5,0.5)"><path d="M 1748 950 L 568.78 950" fill="none" stroke="#2b628b" stroke-width="3.2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(43, 98, 139);"/><path d="M 551.58 950 L 568.78 941.4 L 568.78 958.6 Z" fill="#2b628b" stroke="#2b628b" stroke-width="3.2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(43, 98, 139); stroke: rgb(43, 98, 139);"/></g></g><g data-cell-id="02-handshake-sequence-24"><g><rect x="620" y="988" width="1056" height="56" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#2B628B" font-family="Helvetica" text-anchor="middle" font-size="34px" style="fill: rgb(43, 98, 139);"><text x="1148" y="1031">room.subscribe(roomId) · 业务请求</text></g></g></g><g data-cell-id="02-handshake-sequence-25"><g transform="translate(0.5,0.5)"><path d="M 548 1070 L 1727.22 1070" fill="none" stroke="#2b628b" stroke-width="3.2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(43, 98, 139);"/><path d="M 1744.42 1070 L 1727.22 1078.6 L 1727.22 1061.4 Z" fill="#2b628b" stroke="#2b628b" stroke-width="3.2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(43, 98, 139); stroke: rgb(43, 98, 139);"/></g></g><g data-cell-id="02-handshake-sequence-26"><g><rect x="1824" y="986" width="488" height="140" fill="#eaf2f8" stroke="#2b628b" stroke-width="2" pointer-events="all" style="fill: rgb(234, 242, 248); stroke: rgb(43, 98, 139);"/></g><g><g fill="#2B628B" font-family="Helvetica" text-anchor="middle" font-size="34px" style="fill: rgb(43, 98, 139);"><text x="2068" y="1051">检查当前会话</text><text x="2068" y="1091">检查租户与房间成员</text></g></g></g><g data-cell-id="02-handshake-sequence-27"><g><rect x="620" y="1114" width="1056" height="56" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#2B628B" font-family="Helvetica" text-anchor="middle" font-size="34px" style="fill: rgb(43, 98, 139);"><text x="1148" y="1157">room.event · 服务端推送</text></g></g></g><g data-cell-id="02-handshake-sequence-28"><g transform="translate(0.5,0.5)"><path d="M 1748 1194 L 568.78 1194" fill="none" stroke="#2b628b" stroke-width="3.2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(43, 98, 139);"/><path d="M 551.58 1194 L 568.78 1185.4 L 568.78 1202.6 Z" fill="#2b628b" stroke="#2b628b" stroke-width="3.2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(43, 98, 139); stroke: rgb(43, 98, 139);"/></g></g><g data-cell-id="02-handshake-sequence-29"><g><path d="M 20 1250 L 2324 1250" fill="none" stroke="#526575" stroke-width="2" stroke-miterlimit="10" stroke-dasharray="8 8" pointer-events="stroke" style="stroke: rgb(82, 101, 117);"/></g></g><g data-cell-id="02-handshake-sequence-30"><g><rect x="24" y="1286" width="288" height="60" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#21756C" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="36px" style="fill: rgb(33, 117, 108);"><text x="24" y="1332">协议层</text></g></g></g><g data-cell-id="02-handshake-sequence-31"><g><rect x="24" y="1354" width="288" height="56" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#526575" font-family="Helvetica" text-anchor="start" font-size="30px" style="fill: rgb(82, 101, 117);"><text x="24" y="1395">关闭握手</text></g></g></g><g data-cell-id="02-handshake-sequence-32"><g><rect x="948" y="1260" width="400" height="56" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#21756C" font-family="Helvetica" text-anchor="middle" font-size="34px" style="fill: rgb(33, 117, 108);"><text x="1148" y="1303">Close</text></g></g></g><g data-cell-id="02-handshake-sequence-33"><g transform="translate(0.5,0.5)"><path d="M 548 1326 L 1727.22 1326" fill="none" stroke="#21756c" stroke-width="3.2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(33, 117, 108);"/><path d="M 1744.42 1326 L 1727.22 1334.6 L 1727.22 1317.4 Z" fill="#21756c" stroke="#21756c" stroke-width="3.2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(33, 117, 108); stroke: rgb(33, 117, 108);"/></g></g><g data-cell-id="02-handshake-sequence-34"><g><rect x="620" y="1340" width="1056" height="56" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#21756C" font-family="Helvetica" text-anchor="middle" font-size="34px" style="fill: rgb(33, 117, 108);"><text x="1148" y="1383">Close（回应）</text></g></g></g><g data-cell-id="02-handshake-sequence-35"><g transform="translate(0.5,0.5)"><path d="M 1748 1418 L 568.78 1418" fill="none" stroke="#21756c" stroke-width="3.2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(33, 117, 108);"/><path d="M 551.58 1418 L 568.78 1409.4 L 568.78 1426.6 Z" fill="#21756c" stroke="#21756c" stroke-width="3.2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(33, 117, 108); stroke: rgb(33, 117, 108);"/></g></g><g data-cell-id="02-handshake-sequence-36"><g><rect x="20" y="1444" width="2304" height="52" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#526575" font-family="Helvetica" text-anchor="start" font-size="30px" style="fill: rgb(82, 101, 117);"><text x="20" y="1483">注：纵向虚线表示时间推进，横向虚线分隔处理阶段；认证方式由应用决定。</text></g></g></g></g></g></g></svg>