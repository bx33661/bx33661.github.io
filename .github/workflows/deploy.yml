name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Verify code, types, tests, and content
        run: npm run verify:quick

      - name: Build site and Pagefind index
        env:
          SITE: ${{ vars.SITE != '' && vars.SITE || format('{0}/', steps.pages.outputs.origin) }}
          BASE_URL: ${{ vars.BASE_URL != '' && vars.BASE_URL || (steps.pages.outputs.base_path != '' && format('{0}/', steps.pages.outputs.base_path) || '/') }}
          PUBLIC_ENABLE_ANALYTICS: ${{ vars.PUBLIC_ENABLE_ANALYTICS || 'false' }}
          PUBLIC_ENABLE_COMMENTS: ${{ vars.PUBLIC_ENABLE_COMMENTS || 'false' }}
          PUBLIC_ENABLE_SEARCH: ${{ vars.PUBLIC_ENABLE_SEARCH || 'true' }}
          PUBLIC_GISCUS_REPO: ${{ vars.PUBLIC_GISCUS_REPO }}
          PUBLIC_GISCUS_REPO_ID: ${{ vars.PUBLIC_GISCUS_REPO_ID }}
          PUBLIC_GISCUS_CATEGORY: ${{ vars.PUBLIC_GISCUS_CATEGORY }}
          PUBLIC_GISCUS_CATEGORY_ID: ${{ vars.PUBLIC_GISCUS_CATEGORY_ID }}
          PUBLIC_UMAMI_SCRIPT_URL: ${{ vars.PUBLIC_UMAMI_SCRIPT_URL }}
          PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID }}
          PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.PUBLIC_PLAUSIBLE_DOMAIN }}
          PUBLIC_PLAUSIBLE_SCRIPT_URL: ${{ vars.PUBLIC_PLAUSIBLE_SCRIPT_URL }}
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
        run: npm run build

      - name: Verify built output
        env:
          SITE: ${{ vars.SITE != '' && vars.SITE || format('{0}/', steps.pages.outputs.origin) }}
          BASE_URL: ${{ vars.BASE_URL != '' && vars.BASE_URL || (steps.pages.outputs.base_path != '' && format('{0}/', steps.pages.outputs.base_path) || '/') }}
        run: npm run smoke:dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
