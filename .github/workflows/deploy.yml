name: Deploy to GitHub Pages

on:
  # 在推送到 main 分支时触发
  push:
    branches: [main]
  # PR 检查（仅构建，不部署）
  pull_request:
    branches: [main]
  # 允许手动运行工作流
  workflow_dispatch:

# 仅在顶层保留只读权限；部署和百度推送各自声明所需的最小写权限
permissions:
  contents: read

# 同一分支部署按序排队；PR 预览检查彼此独立且新推送自动取消旧运行
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SITE: ${{ vars.SITE }}
      BASE_URL: ${{ vars.BASE_URL }}
      PUBLIC_GOOGLE_ANALYTICS_ID: ${{ vars.PUBLIC_GOOGLE_ANALYTICS_ID }}
      PUBLIC_ENABLE_ANALYTICS: ${{ vars.PUBLIC_ENABLE_ANALYTICS }}
      PUBLIC_GTM_ID: ${{ vars.PUBLIC_GTM_ID }}
      PUBLIC_POSTHOG_KEY: ${{ vars.PUBLIC_POSTHOG_KEY }}
      PUBLIC_POSTHOG_HOST: ${{ vars.PUBLIC_POSTHOG_HOST }}
      PUBLIC_ENABLE_COMMENTS: ${{ vars.PUBLIC_ENABLE_COMMENTS }}
      PUBLIC_ENABLE_SEARCH: ${{ vars.PUBLIC_ENABLE_SEARCH }}
      PUBLIC_GISCUS_REPO: ${{ vars.PUBLIC_GISCUS_REPO }}
      PUBLIC_GISCUS_REPO_ID: ${{ vars.PUBLIC_GISCUS_REPO_ID }}
      PUBLIC_GISCUS_CATEGORY: ${{ vars.PUBLIC_GISCUS_CATEGORY }}
      PUBLIC_GISCUS_CATEGORY_ID: ${{ vars.PUBLIC_GISCUS_CATEGORY_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Install browser for visual checks
        run: npx playwright install --with-deps chromium

      - name: Full verification (includes build and dist checks)
        run: npm run verify:full

      - name: Rebuild production bundle when live comments or analytics are enabled
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (vars.PUBLIC_ENABLE_COMMENTS == 'true' || vars.PUBLIC_ENABLE_ANALYTICS == 'true')
        run: npm run build && npm run smoke:dist

      - name: Upload visual diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diagnostics
          path: .visual-artifacts/
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Upload dist for baidu push
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ./dist
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    permissions:
      contents: read
      pages: write
      id-token: write
    # 只在推送到 main 分支时部署，PR 时跳过
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  baidu-push:
    name: Push URLs to Baidu
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/baidu-notify.yml
    secrets: inherit

  indexnow-push:
    name: Notify search engines via IndexNow
    needs: deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./dist
      - uses: actions/cache@v4
        with:
          path: .indexnow-cache.json
          key: indexnow-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-${{ github.ref_name }}-
      - name: Submit only new, changed and removed URLs
        run: node scripts/indexnow-push.mjs
